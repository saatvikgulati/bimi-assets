<svg xmlns="http://w3.org" version="1.2" baseProfile="tiny-ps" viewBox="0 0 500 500" width="500" height="500">
  <title>Total Movements Private Limited</title>
  <desc>Official BIMI SVG Logo for Total Movements Private Limited featuring a solid maroon shield background with the stylized white T and M monogram and arrow detail.</desc>
  
  <g id="Logo-Container">
    <!-- Solid Corporate Maroon Shield Base -->
    <path fill="#B81D43" d="M 20,400 L 20,45 Q 250,15 480,45 L 480,400 Z" />
    
    <!-- Left White Cutout Panel Shape -->
    <path fill="#FFFFFF" d="M 20,400 L 130,400 L 160,195 C 145,130 135,80 115,45 L 20,45 Z" />
    
    <!-- Right White Cutout Panel Shape -->
    <path fill="#FFFFFF" d="M 480,400 L 370,400 L 340,195 C 355,130 365,80 385,45 L 480,45 Z" />
    
    <!-- Center Lower White Void Basin -->
    <path fill="#FFFFFF" d="M 160,400 L 340,400 L 322,275 C 275,302 225,302 178,275 Z" />

    <!-- Top Horizontal Crossbar of the "T" -->
    <rect fill="#FFFFFF" x="120" y="45" width="260" height="42" />

    <!-- The Elephant Trunk / Tornado Graphic Center Element -->
    <path fill="#FFFFFF" d="M 200,87 C 210,150 230,190 252,222 C 266,242 268,260 254,260 C 242,260 234,235 231,215 C 220,185 214,145 200,87 Z" />
    
    <!-- Fine Details/Wrinkles within the Trunk Segment -->
    <path d="M 216,150 Q 222,148 226,151" stroke="#B81D43" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 219,160 Q 225,158 228,161" stroke="#B81D43" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="206" cy="155" r="3.5" fill="#B81D43" />
    <circle cx="264" cy="160" r="4.5" fill="#B81D43" />

    <!-- Clean White Double-Headed Curved Arrow Accent -->
    <path fill="#FFFFFF" d="M 172,215 C 215,280 285,280 328,215 L 314,204 L 356,198 L 352,242 L 338,231 C 290,295 210,295 162,231 L 148,242 L 144,198 L 186,204 Z" />
  </g>
</svg>
